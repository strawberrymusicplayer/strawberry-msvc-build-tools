name: Update
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:

  update:
    name: Check for new versions
    if: github.repository == 'strawberrymusicplayer/strawberry-msvc-build-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{secrets.UPDATE_TOKEN}}

    steps:

      - name: Check token
        if: env.GH_TOKEN == ''
        run: |
          echo "::error::Missing UPDATE_TOKEN secret."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{secrets.UPDATE_TOKEN}}

      - name: Configure git
        run: |
          git config user.name "$(gh api user --jq '.login')"
          git config user.email "$(gh api user --jq '.id')+$(gh api user --jq '.login')@users.noreply.github.com"

      # Install the SSH key here, so it's not passed to the update script.
      - name: Install SSH key
        env:
          SSH_KEY: ${{secrets.SSH_KEY}}
          SSH_KNOWN_HOSTS: ${{secrets.SSH_KNOWN_HOSTS}}
        run: |
          if [ "${SSH_KEY}" = "" ] || [ "${SSH_KNOWN_HOSTS}" = "" ]; then
            echo "::warning::Missing SSH_KEY or SSH_KNOWN_HOSTS secret, files will not be uploaded to the packages server."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "${SSH_KEY}" > ~/.ssh/packages_key)
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/packages_known_hosts

      - name: Update
        env:
          SSH_HOST: ${{secrets.SSH_HOST}}
          SSH_PORT: ${{secrets.SSH_PORT}}
          SSH_USER: ${{secrets.SSH_USER}}
          PACKAGES_PATH: ${{secrets.PACKAGES_PATH}}
        run: ./scripts/update.sh

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/packages_key ~/.ssh/packages_known_hosts
